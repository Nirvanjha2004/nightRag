# Single-command deployment:
#
#   cp .env.example .env    # add your two API keys
#   docker compose up --build
#
# Then open http://localhost:8000

services:
  nightrag:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NIGHTRAG_HOST: 0.0.0.0
      NIGHTRAG_QDRANT_DIR: /data/qdrant
    volumes:
      # The index lives here. Delete this volume and every ingested codebase
      # has to be re-embedded (which costs API calls, not just time).
      - nightrag-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  nightrag-data:
