<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NightRag</title>
    <meta
      name="description"
      content="Ask questions about a Python codebase — hybrid retrieval, LLM reranking and corrective RAG, with the whole pipeline visible."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#08090c" />

    <!-- Inter + JetBrains Mono, with a full system fallback stack in index.css
         so the app is still correctly typeset offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so a light-theme user never sees a dark flash.
      (function () {
        try {
          var stored = localStorage.getItem("nightrag.theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* private mode — the dark default in the markup already applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
