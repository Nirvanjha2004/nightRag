# Render Blueprint - deploy NightRag on the FREE plan.
#
# Two ways to use this file:
#   1. Dashboard: "New +" -> "Blueprint" -> pick your repo (it finds render.yaml).
#   2. Auto: push render.yaml to your GitHub repo; Render's Blueprint PR flow
#      can spin up a preview from it.
#
# The multi-stage Dockerfile already builds the React UI and runs the FastAPI
# server, so the whole app is ONE web service - no separate static site.
#
# Why a hosted Qdrant instead of the built-in store?
#   Free Render services have an EPHEMERAL filesystem: the embedded qdrant_data
#   directory is wiped on every redeploy (and the instance spins down when
#   idle). Qdrant Cloud's free tier (1 GB) keeps the vector index persistent,
#   so your ingested code survives redeploys.
#
# IMPORTANT - secrets (all `sync: false`), paste them in the dashboard:
#   JINA_API_KEY, GROQ_API_KEY, NIGHTRAG_QDRANT_API_KEY
#   (NIGHTRAG_QDRANT_URL has a placeholder - replace it with your cluster URL.)

services:
  - type: web
    name: nightrag
    runtime: docker
    repo: https://github.com/nirvanjha2004/nightRag   # <- your repo URL
    plan: free
    healthCheckPath: /api/health
    dockerContext: .

    envVars:
      - key: NIGHTRAG_HOST
        value: 0.0.0.0
      # Render injects PORT (default ~10000); settings.py falls back to it when
      # NIGHTRAG_PORT is unset, so the container listens where Render expects.
      - key: NIGHTRAG_QDRANT_URL
        value: https://b3f5edcf-47bf-4567-a53e-769fc14fc2e4.eu-central-1-0.aws.cloud.qdrant.io
      # API key stays out of git: paste it in the Render Environment tab
      # (Qdrant Cloud dashboard -> Security -> API keys).
      - key: NIGHTRAG_QDRANT_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional overrides - uncomment to use:
      # - key: NIGHTRAG_MODEL
      #   value: openai/gpt-oss-120b
      # - key: NIGHTRAG_COLLECTION
      #   value: code_chunks
      # - key: NIGHTRAG_CORS_ORIGINS
      #   value: https://your-frontend.example.com

  # --- Paid alternative: persistent disk instead of hosted Qdrant ----------
  # Persistent disks need a PAID instance (Starter $7/mo or higher). This keeps
  # the embedded store on a disk mounted at /data; uncomment and remove the
  # Qdrant Cloud vars above if you upgrade.
  # - type: web
  #   name: nightrag
  #   runtime: docker
  #   repo: https://github.com/YOUR_USERNAME/nightRag
  #   plan: starter
  #   healthCheckPath: /api/health
  #   envVars:
  #     - key: NIGHTRAG_HOST
  #       value: 0.0.0.0
  #     - key: JINA_API_KEY
  #       sync: false
  #     - key: GROQ_API_KEY
  #       sync: false
  #   disk:
  #     name: qdrant-data
  #     mountPath: /data
  #     sizeGB: 1
